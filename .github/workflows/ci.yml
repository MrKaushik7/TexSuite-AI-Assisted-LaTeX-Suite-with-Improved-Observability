name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: ./mvnw --batch-mode verify
      - name: Verify launcher diagnostics
        run: sh scripts/test-install.sh
      - name: Publish coverage and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-tests
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/jqwik-database*
          retention-days: 14
          if-no-files-found: error
