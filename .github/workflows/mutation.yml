name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Focused mutation tests
        run: ./mvnw --batch-mode -Pmutation -Djacoco.skip=true test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Publish mutation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: target/pit-reports/
          retention-days: 14
          if-no-files-found: error
